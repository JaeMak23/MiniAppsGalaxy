name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # - name: Ensure Android SDK platform 37 is installed
      #   run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Android Lint
        run: ./gradlew :androidApp:lintDebug

      # TODO: no unit tests yet, will enable once I start writing them
      # - name: Unit tests
      #   run: ./gradlew testDebugUnitTest test

      - name: Build Android (debug)
        run: ./gradlew :androidApp:assembleDebug

      - name: Build Desktop
        run: ./gradlew :desktopApp:build

      # TODO: enable this along with the unit tests step above
